<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valuace e-shopu | M&Ai</title>
<meta name="description" content="Online valuační kalkulačka pro e-commerce podniky. AI analýza finančních dat, KPI a kvalitativních faktorů.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../logo/mnai-logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  /* Make nav sticky instead of fixed so it doesn't overlap iframe */
  nav#nav, nav#nav.scrolled {
    position: sticky;
    padding: 12px 64px;
    background: rgba(13,11,26,0.95);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(155,89,212,0.15);
    flex-shrink: 0;
  }

  /* Iframe fills remaining space */
  .calc-iframe-section {
    flex: 1;
    position: relative;
    z-index: 1;
    display: flex;
    overflow: hidden;
  }

  .calc-iframe-section iframe {
    flex: 1;
    border: none;
    background: var(--purple-deep);
    width: 100%;
  }

  /* Hide starfield on calculator page for cleaner look */
  #starfield { display: none; }
  footer { display: none; }

  @media (max-width: 900px) {
    nav#nav, nav#nav.scrolled { padding: 12px 24px; }
  }
</style>
</head>
<body>

<!-- STARFIELD -->
<canvas id="starfield"></canvas>

<!-- NAV -->
<nav id="nav" class="scrolled">
  <a href="../" class="nav-logo"><svg class="logo-cube-3d" width="40" height="40" viewBox="0 0 50 50"></svg><span class="logo-text">M&amp;Ai</span></a>
  <ul class="nav-links">
    <li><a href="../#o-nas">O nás</a></li>
    <li><a href="../#sluzby">Služby</a></li>
    <li><a href="./" style="color:var(--purple-light);">Valuace</a></li>
    <li><a href="../#blog">Blog</a></li>
    <li><a href="../#tym">Tým</a></li>
    <li><a href="../#faq">FAQ</a></li>
    <li><a href="../#kontakt" class="nav-cta">Konzultace</a></li>
  </ul>
  <div class="nav-controls">
    <button class="theme-toggle" id="themeToggle" aria-label="Přepnout světlý/tmavý režim" title="Světlý/tmavý režim">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <div class="lang-group">
      <a href="../en/" class="lang-toggle" title="English version">EN</a>
      <a href="../de/" class="lang-toggle" title="Deutsche Version">DE</a>
    </div>
  </div>
</nav>

<!-- CALCULATOR IFRAME -->
<div class="calc-iframe-section">
  <iframe
    src="https://ecommerce-valuator-production.up.railway.app"
    title="E-commerce valuační kalkulačka"
    allow="clipboard-write"
  ></iframe>
</div>

<script src="../js/main.js"></script>
<script>
  // Send current theme to iframe once it loads
  var calcIframe = document.querySelector('.calc-iframe-section iframe');
  if (calcIframe) {
    calcIframe.addEventListener('load', function() {
      var theme = localStorage.getItem('theme') || 'dark';
      calcIframe.contentWindow.postMessage({ type: 'theme-change', theme: theme }, '*');
    });
  }
</script>
</body>
</html>
